[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "twobytwo-wat-analysis"
version = "0.1.0"
description = "Whole-anode pulse recovery and packet readout timing in ND-LAr 2×2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "h5py>=3.8", "matplotlib>=3.6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
wat-analysis = "wat_analysis.cli:main"

[project.urls]
Repository = "https://github.com/BrunoGelli/2x2-wat-analysis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wat_analysis = ["data/*.json", "data/*.npz", "data/*.txt"]
